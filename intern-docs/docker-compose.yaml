version: '3.8'

services:
  backend:
    build: .
    container_name: cosmetic-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/cosmeticshop
      - SENDPULSE_USER=your_sendpulse_user
      - SENDPULSE_PASSWORD=your_sendpulse_password
      - JWT_SECRET=your_jwt_secret
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo:6.0
    container_name: cosmetic-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

